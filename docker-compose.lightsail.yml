# Docker Compose optimizado para AWS Lightsail
# Construye desde código fuente

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetclinic_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetclinic-network
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetclinic-backend
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Database
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/vetclinic_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      
      # Email
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      
      # Application URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081}
      CLINIC_NAME: ${CLINIC_NAME:-VetClinic Pro}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vetclinic-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Frontend React/Vite
  frontend:
    build:
      context: ../frontend-vetclinio-1
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://3.232.108.231:8081/api}
    container_name: vetclinic-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://3.232.108.231:8081/api}
    ports:
      - "80:80"  # Puerto 80 para HTTP estándar
    depends_on:
      - backend
    networks:
      - vetclinic-network
    restart: unless-stopped

networks:
  vetclinic-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

