services:
  # Base de datos PostgreSQL (para producción local, en AWS usar RDS)
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetclinic_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetclinic-network-prod
    restart: unless-stopped
    # En producción, considera usar un volumen externo o RDS
    # volumes:
    #   - /var/lib/postgresql/data:/var/lib/postgresql/data

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetclinic-backend-prod
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Database (usar RDS en AWS)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      
      # JWT (OBLIGATORIO en producción)
      JWT_SECRET: ${JWT_SECRET}
      
      # Email
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      
      # Application URLs (configurar según tu dominio)
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      CLINIC_NAME: ${CLINIC_NAME:-VetClinic Pro}
      
      # CORS (configurar según tu dominio)
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vetclinic-network-prod
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    # Limitar recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend React/Vite
  frontend:
    build:
      context: ../frontend-vetclinio-1
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: vetclinic-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vetclinic-network-prod
    restart: unless-stopped
    # Limitar recursos
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  vetclinic-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local

