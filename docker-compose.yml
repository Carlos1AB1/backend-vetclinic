services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    environment:
      POSTGRES_DB: vetclinic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetclinic-network

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetclinic-backend
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: dev
      
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/vetclinic_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      
      # Email
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      
      # Application
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8081
      CLINIC_NAME: ${CLINIC_NAME:-VetClinic Pro}
      
      # CORS
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vetclinic-network
    volumes:
      - ./logs:/app/logs

  # Frontend React/Vite
  frontend:
    build:
      context: ../frontend-vetclinio-1
      dockerfile: Dockerfile
    container_name: vetclinic-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - vetclinic-network

networks:
  vetclinic-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

