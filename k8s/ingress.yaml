apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vetclinic-ingress
  namespace: vetclinic
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'  # Descomenta cuando tengas certificado SSL
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:340914758022:certificate/CERTIFICATE_ID"  # Descomenta y configura cuando tengas certificado SSL
    alb.ingress.kubernetes.io/healthcheck-path: /api/actuator/health
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  rules:
  - host: api.vetclinic.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8081
  - host: vetclinic.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: www.vetclinic.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

