<!DOCTYPE html>
<html lang="es" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{title}}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Importación de fuente premium */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Reset básico */
        body, td, th {
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            color: #334155;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            background-color: #F8FAFC;
        }

        /* Estilos Responsivos para Móviles */
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                margin: 0 !important;
            }
            .content-padding {
                padding: 30px 20px !important;
            }
            .mobile-hide {
                display: none !important;
            }
            .header-logo {
                width: 70px !important;
                height: auto !important;
            }
        }

        /* Estilos de Botones y Enlaces */
        a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F8FAFC;">
    
    <!-- PREHEADER: Texto invisible de previsualización -->
    <div style="display: none; max-height: 0px; overflow: hidden; mso-hide: all;">
        {{preheader}}
        &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
    </div>

    <center style="width: 100%; table-layout: fixed; background-color: #F8FAFC; padding-bottom: 40px;">
        
        <!-- CONTENEDOR PRINCIPAL -->
        <table class="email-container" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-top: 40px; margin-bottom: 40px; border: 1px solid #E2E8F0;">
            
            <!-- 1. BARRA SUPERIOR DE MARCA (Accent Bar) -->
            <tr>
                <td height="6" style="background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 100%); font-size: 0; line-height: 0;">&nbsp;</td>
            </tr>

            <!-- 2. HEADER CON LOGO Y GRADIENTE PROFESIONAL -->
            <tr>
                <td style="background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); padding: 40px 30px; position: relative; overflow: hidden;">
                    <!-- Elementos decorativos de fondo -->
                    <div style="position: absolute; top: -30px; right: -30px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%;"></div>
                    <div style="position: absolute; bottom: -20px; left: -20px; width: 100px; height: 100px; background: rgba(255,255,255,0.05); border-radius: 50%;"></div>
                    
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="position: relative; z-index: 1;">
                        <tr>
                            <td align="center" style="padding: 0;">
                                <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                                    <tr>
                                        <td align="center" style="padding: 0;">
                                            <a href="{{frontendUrl}}" target="_blank" style="text-decoration: none; display: block;">
                                                <table border="0" cellpadding="0" cellspacing="0" style="background: white; padding: 12px; border-radius: 16px; margin: 0 auto;">
                                                    <tr>
                                                        <td align="center" style="padding: 0;">
                                                            <img src="cid:logo" 
                                                                 alt="VetClinic Pro" 
                                                                 width="66" 
                                                                 height="66" 
                                                                 border="0" 
                                                                 style="display: block; border: 0; width: 66px; height: 66px; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;" />
                                                        </td>
                                                    </tr>
                                                </table>
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td align="center" style="padding-top: 20px;">
                                <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
                                    VetClinic Pro
                                </h1>
                                <p style="margin: 8px 0 0 0; color: rgba(255,255,255,0.95); font-size: 14px; font-weight: 300;">
                                    Sistema de Gestión Veterinaria Profesional
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- 3. CONTENIDO DINÁMICO -->
            <!-- Aquí es donde inyectas el HTML específico de cada correo -->
            <tr>
                <td class="content-padding" style="padding: 48px 56px; background-color: #ffffff; font-size: 16px; line-height: 1.6; color: #334155;">
                    
                    <!-- MARCADOR DE POSICIÓN PARA TU CONTENIDO -->
                    {{content}}

                </td>
            </tr>

            <!-- 4. FOOTER PROFESIONAL -->
            <tr>
                <td style="background-color: #1e293b; color: #ffffff; padding: 35px 40px; text-align: center;">
                    <!-- Nombre de la Clínica -->
                    <p style="margin: 0 0 15px 0; font-size: 14px; color: #ffffff; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;">
                        {{clinicName}}
                    </p>
                    
                    <!-- Copyright -->
                    <p style="margin: 0 0 20px 0; font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.6;">
                        &copy; {{currentYear}} Todos los derechos reservados.<br>
                        <span style="color: rgba(255,255,255,0.7);">Cuidando vidas, un paciente a la vez.</span>
                    </p>
                    
                    <!-- Línea divisoria -->
                    <div style="border-top: 1px solid rgba(255,255,255,0.2); margin: 20px 0; padding-top: 20px;">
                        <!-- Enlaces Legales -->
                        <p style="margin: 0; font-size: 11px; color: rgba(255,255,255,0.7);">
                            <a href="{{frontendUrl}}" style="color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; margin: 0 8px;">Visitar Sitio Web</a> 
                            <span style="color: rgba(255,255,255,0.5);">•</span> 
                            <a href="{{frontendUrl}}/privacy" style="color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; margin: 0 8px;">Política de Privacidad</a>
                        </p>
                    </div>
                </td>
            </tr>
        </table>

        <!-- Espaciado final invisible -->
        <div style="height: 40px; font-size: 0; line-height: 0;">&nbsp;</div>

    </center>
</body>
</html>
