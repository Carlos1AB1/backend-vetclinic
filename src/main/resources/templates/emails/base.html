<!DOCTYPE html>
<html lang="es" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{title}}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body, td, th { font-family: 'Inter', Helvetica, Arial, sans-serif; }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F3F4F6; width: 100%;">
    <!-- Preheader oculto -->
    <div style="display: none; max-height: 0px; overflow: hidden;">{{preheader}}</div>
    
    <center style="width: 100%; table-layout: fixed; background-color: #F3F4F6; padding-bottom: 60px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F3F4F6; margin: 0 auto; max-width: 600px;">
            
            <!-- Header con Logo -->
            <tr>
                <td align="center" style="padding: 40px 0 30px 0;">
                    <table cellpadding="0" cellspacing="0">
                        <tr>
                            <td style="background-color: #4F46E5; padding: 12px; border-radius: 12px; margin-right: 15px;">
                                <span style="font-size: 28px;">🐾</span>
                            </td>
                            <td style="padding-left: 15px;">
                                <h1 style="margin: 0; color: #1F2937; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">{{clinicName}}</h1>
                                <p style="margin: 0; color: #4F46E5; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Veterinary Care</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- Contenedor Principal (Tarjeta Blanca) -->
            <tr>
                <td style="background-color: #ffffff; padding: 48px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
                    {{content}}
                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td align="center" style="padding-top: 30px;">
                    <p style="margin: 0 0 10px 0; color: #6B7280; font-size: 12px;">© {{currentYear}} {{clinicName}}. Todos los derechos reservados.</p>
                    <p style="margin: 0; color: #6B7280; font-size: 12px;">
                        <a href="{{frontendUrl}}" style="color: #6B7280; text-decoration: none;">Privacidad</a> &bull; 
                        <a href="{{frontendUrl}}" style="color: #6B7280; text-decoration: none;">Soporte</a>
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
