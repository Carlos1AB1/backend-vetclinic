spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  mail:
    test-connection: false

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    com.vetclinic: INFO
